version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: etulib
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: node_app
    ports:
      - "5173:5173"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/etulib"
      PORT: 5173
      ORIGIN: "http://localhost:5173"
    depends_on:
      - db

volumes:
  postgres_data: